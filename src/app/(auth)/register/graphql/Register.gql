mutation Register(
  $email: String!
  $password: String!
  $name: String
  $contactNumber: String
  $consent: SignUpConsentInput
) {
  register(
    email: $email
    password: $password
    name: $name
    contactNumber: $contactNumber
    consent: $consent
  ) {
    token
    user {
      id
      email
      emailVerified
    }
  }
}
