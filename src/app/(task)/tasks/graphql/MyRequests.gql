query MyRequests($filter: TaskFilter, $sort: TaskSort) {
  me {
    tasksPosted(filter: $filter, sort: $sort) {
      id
      title
      description
      categories
      createdAt
      budget {
        amount
        currency
        type
        paymentMethod
      }
      datetime {
        date
        time
        type
      }
      images
      status
      # Suspended (BE-108): still listed for its owner and parties, but frozen.
      suspension {
        bySlashie
        posterSuspended
      }
      location {
        lat
        lng
        name
        address
      }
      poster {
        id
        profile {
          name
        }
      }
      quotes {
        id
        taskId
        workerUserId
        price {
          currency
          amount
        }
        message
        proposedSlots {
          id
          start
          end
        }
        status
        createdAt
        worker {
          id
          profile {
            name
            avatarUrl
          }
        }
      }
    }
  }
}
