mutation UpdateTask($taskId: ID!, $input: UpdateTaskInput!) {
  updateTask(taskId: $taskId, input: $input) {
    id
    title
    description
    categories
    status
    budget {
      amount
      currency
      unit
      customUnit
    }
    paymentMethods
    location {
      lat
      lng
      name
      address
    }
    datetime {
      date
      time
      type
    }
    images
  }
}
