# Worker directory for /workers.
# PUBLIC-SAFE FIELDS ONLY (BE-34): approximate preferredLocation coordinates +
# name, and the computed serviceAreaLabel — never an address, phone, or email.
query WorkersSearch($filter: WorkerFilter, $sort: WorkerSort) {
  workers(filter: $filter, sort: $sort) {
    id
    tagline
    # BE-130: the worker's title, only while they have Slashie Pro.
    title
    # BE-137: whether they have Slashie Pro now (the card's Pro badge).
    hasPro
    isVerified
    yearsExperience
    skills
    serviceAreaLabel
    ratingSummary {
      average
      count
    }
    serviceArea {
      radiusMiles
    }
    preferredLocation {
      name
      lat
      lng
    }
    user {
      id
      profile {
        name
        avatarUrl
      }
    }
    profile {
      avatarUrl
    }
  }
}
