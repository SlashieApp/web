mutation CreateTask($input: CreateTaskInput!) {
  createTask(input: $input) {
    id
    title
    description
    categories
    budget {
      amount
      currency
      unit
      customUnit
    }
    paymentMethods
    datetime {
      date
      time
      type
    }
    images
    status
    location {
      lat
      lng
      name
      address
    }
    poster {
      id
      profile {
        name
      }
    }
    quotes {
      id
    }
  }
}
