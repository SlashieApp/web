#import "./threadItemFields.gql"

fragment ThreadFields on Thread {
  id
  kind
  title
  unreadCount
  canSend
  blockedByMe
  updatedAt
  task {
    id
    title
  }
  otherParty {
    userId
    name
    avatarUrl
    deleted
    ratingSummary {
      average
      count
    }
    hostedCompletedCount
    completedJobsCount
  }
  attention {
    kind
    count
  }
  lastItem {
    ...ThreadItemFields
  }
}
