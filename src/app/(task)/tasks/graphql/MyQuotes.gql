query MyQuotes($filter: TaskFilter, $sort: TaskSort) {
  me {
    worker {
      quotedTasks(filter: $filter, sort: $sort) {
        id
        title
        description
        categories
        budget {
          amount
          currency
          type
          paymentMethod
        }
        datetime {
          date
          time
          type
        }
        images
        status
        # Booked or completed (BE-113): a PENDING quote of yours stays PENDING
        # while someone else is booked, and this says so.
        bookingStatus
        # Suspended (BE-108): still listed for its owner and parties, but frozen.
        suspension {
          bySlashie
          posterSuspended
        }
        location {
          lat
          lng
          name
          address
        }
        poster {
          id
          profile {
            name
          }
        }
        quotes {
          id
          taskId
          workerUserId
          price {
            currency
            amount
          }
          message
          proposedSlots {
            id
            start
            end
          }
          status
          createdAt
        }
      }
    }
  }
}
