# BE-60. Separate from MyNotifications.gql so the bell still loads when
# isPopup / isClosed / dismissedAt are not deployed yet.
query MyNotificationSurfaces($first: Int) {
  me {
    notifications(first: $first, unreadOnly: false) {
      items {
        id
        isPopup
        isClosed
        dismissedAt
        imageUrl
        extraCtaUrl
      }
    }
  }
}
