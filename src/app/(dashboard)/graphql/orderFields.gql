# KEEP IN SYNC with TaskDetailOrderFields
# (src/app/(task)/tasks/[slug]/graphql/taskDetailOrderFields.gql).
fragment OrderFields on Order {
  id
  taskId
  quoteId
  customerUserId
  workerUserId
  status
  agreedPrice {
    amount
    currency
  }
  snapshot {
    title
    description
    categories
    location {
      lat
      lng
      name
      address
    }
    datetime {
      date
      time
      type
    }
    contactMethod
    quoteMessage
    budgetAmount
    paymentMethod
  }
  bookedStart
  bookedEnd
  pendingRequest {
    kind
    requestedByUserId
    requestedAt
    proposedSlots {
      id
      start
      end
    }
  }
  myCloseAction {
    kind
    at
    failedReason
  }
  counterpartyCloseAction {
    kind
    at
  }
  autoDoneAt
  createdAt
  closedAt
}
