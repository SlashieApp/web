mutation LoginWithApple(
  $token: String!
  $nonce: String
  $authorizationCode: String
  $firstName: String
  $lastName: String
) {
  loginWithMethod(
    input: {
      method: APPLE
      oauthToken: $token
      nonce: $nonce
      authorizationCode: $authorizationCode
      firstName: $firstName
      lastName: $lastName
    }
  ) {
    token
    user {
      id
      email
      disabled
      emailVerified
      enabledLoginMethods
    }
  }
}
