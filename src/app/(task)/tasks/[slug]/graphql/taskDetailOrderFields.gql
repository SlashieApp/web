# Order selection shared by the task-detail queries and order mutations. KEEP IN
# SYNC with OrderFields (src/app/(dashboard)/graphql/orderFields.gql):
# divergent selections on the same normalized Order cause cache merge gaps.
fragment TaskDetailOrderFields on Order {
  id
  taskId
  quoteId
  customerUserId
  workerUserId
  status
  agreedPrice {
    amount
    currency
  }
  snapshot {
    title
    description
    categories
    location {
      lat
      lng
      name
      address
    }
    datetime {
      date
      time
      type
    }
    contactMethod
    quoteMessage
    budgetAmount
    paymentMethod
  }
  bookedStart
  bookedEnd
  # Until when either party may cancel on their own (BE-125); null once that
  # is over or the booking is closed or in CONFLICT.
  oneSidedCancelUntil
  pendingRequest {
    kind
    requestedByUserId
    requestedAt
    proposedSlots {
      id
      start
      end
    }
  }
  myCloseAction {
    kind
    at
    failedReason
  }
  counterpartyCloseAction {
    kind
    at
  }
  autoDoneAt
  createdAt
  closedAt
  # The other party's account is suspended (BE-108): the booking is frozen.
  counterpartySuspension {
    role
    name
    canReopen
  }
}
