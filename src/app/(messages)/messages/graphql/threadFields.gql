#import "./threadItemFields.gql"

fragment ThreadFields on Thread {
  id
  kind
  title
  unreadCount
  canSend
  blockedByMe
  updatedAt
  task {
    id
    title
    status
    # FE-362: Posted by you / Working on in the inbox filter.
    poster {
      id
    }
  }
  otherParty {
    userId
    name
    avatarUrl
    deleted
  }
  attention {
    kind
    count
  }
  lastItem {
    ...ThreadItemFields
  }
}
