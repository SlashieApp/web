fragment ThreadItemFields on ThreadItem {
  id
  threadId
  type
  flashKind
  title
  body
  imageUrl
  isMine
  taskId
  quoteId
  orderId
  createdAt
  author {
    userId
    name
    avatarUrl
    deleted
  }
  # BE-81: the quote a quote flash is about (owner and quoting worker only).
  quote {
    id
    taskId
    workerUserId
    status
    # BE-108: the quoting worker's account is suspended, so it can't be answered.
    workerSuspended
    message
    price {
      amount
      currency
    }
    proposedSlots {
      id
      start
      end
    }
    worker {
      id
      profile {
        name
        avatarUrl
      }
    }
  }
}
