query Tasks($filter: TaskFilter, $sort: TaskSort, $first: Int, $after: ID) {
  tasks(filter: $filter, sort: $sort, first: $first, after: $after) {
    id
    title
    description
    categories
    budget {
      amount
      currency
      type
      paymentMethod
    }
    datetime {
      date
      time
      type
    }
    images
    status
    views
    location {
      lat
      lng
      name
      address
    }
    poster {
      id
      hostedCompletedCount
      profile {
        name
        avatarUrl
      }
    }
  }
}
