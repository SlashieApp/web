#import "./taskDetailOrderFields.gql"

# Client-side task detail init: viewer-scoped fields + quotes. Merged with SSR
# TaskCore in TaskDetailProvider.
query Task($id: ID!) {
  task(id: $id) {
    id
    status
    location {
      lat
      lng
      name
      address
    }
    poster {
      id
      email
      profile {
        name
        avatarUrl
        contactNumber
      }
    }
    # The Activity log (FE-372), oldest first and already filtered for this
    # viewer: `actor` is null when they may not know who (or nobody acted),
    # `worker` is only there for the owner and that worker.
    timeline {
      type
      timestamp
      byViewer
      changedFields
      # TASK_SUSPENDED / TASK_UNSUSPENDED: which suspension (BE-108).
      suspensionReason
      actor {
        id
        profile {
          name
        }
      }
      worker {
        id
        profile {
          name
        }
      }
    }
    # Why the task is suspended (BE-108), for its owner and parties; null
    # when it isn't. Everything on a suspended task is frozen.
    suspension {
      bySlashie
      posterSuspended
    }
    # Newest first; a reopened task keeps its old, cancelled booking.
    orders {
      ...TaskDetailOrderFields
    }
    # KEEP IN SYNC with the quotes selection in TaskForEdit.gql.
    quotes {
      id
      taskId
      workerUserId
      price {
        currency
        amount
      }
      message
      proposedSlots {
        id
        start
        end
      }
      status
      createdAt
      # The quoting worker's account is suspended: the quote is frozen.
      workerSuspended
      worker {
        id
        profile {
          name
          avatarUrl
          contactNumber
        }
        worker {
          id
          isVerified
        }
      }
    }
  }
}
