#import "./WorkerMembershipFields.gql"

fragment MeShell on User {
  id
  email
  profile {
    name
    avatarUrl
  }
  # Slashie Pro is the account's (BE-145, FE-591), customers included.
  membership {
    ...WorkerMembershipFields
  }
  worker {
    id
    earnings {
      pending {
        amount
        currency
      }
    }
  }
}
